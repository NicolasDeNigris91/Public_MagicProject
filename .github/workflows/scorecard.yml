name: OpenSSF Scorecard

# Weekly supply-chain hygiene audit + on every push to main. Produces a
# 0–10 score across signed releases, branch protection, dependency
# update tooling, dangerous workflow patterns, secrets exposure, and
# more. Results are uploaded to GitHub's code-scanning UI and surfaced
# via the public scorecard.dev API for the README badge.

on:
  branch_protection_rule:
  schedule:
    - cron: '23 5 * * 1'
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: OpenSSF Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed by the action to upload SARIF results to code-scanning.
      security-events: write
      # Needed to read enabled-protections via the OIDC token.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes results so the public scorecard.dev API serves
          # the badge data. Set false if the repo must stay opaque.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v3
        with:
          sarif_file: results.sarif
